name: Prettier Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
      - run: npm install
      - run: npm run prettier:check
